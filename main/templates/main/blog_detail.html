{% extends 'main/base.html' %}

{% block content %}
    <div class="container">
        <a href="{% url 'blogs' %}" class="back-link">&larr; Back to Blogs</a>
        
        <div class="card" style="text-align: left;">
            <h1 style="color: #006666; margin-top: 0;">{{ post.title }}</h1>
            <p class="text-muted" style="margin-bottom: 25px;">By {{ post.author }} on {{ post.published_date|date:"F j, Y" }}</p>
            
            <div style="color: #444; line-height: 1.8; font-size: 16px; white-space: pre-line;">
                {{ post.content }}
            </div>
        </div>
    </div>
{% endblock %}
